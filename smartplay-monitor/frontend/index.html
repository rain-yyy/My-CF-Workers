<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTPLAY // 监控终端 V2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030407;
            --surface-color: #0a0f16;
            --surface-active: #131b26;
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, 0.1);
            --secondary: #7000ff;
            --accent: #ff003c;
            --success: #00ff9f;
            --text-main: #e0f2f1;
            --text-dim: #5c677d;
            --border-color: #1f293a;
            --grid-color: rgba(0, 240, 255, 0.03);
            
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --glow: 0 0 10px rgba(0, 240, 255, 0.5);
            --glow-text: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-display);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            position: relative;
        }

        /* Ambient Noise Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header Styling */
        header {
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 2px;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 4rem;
            line-height: 0.9;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        h1::after {
            content: "SMARTPLAY // MONITOR";
            position: absolute;
            left: 2px;
            top: 0;
            color: var(--primary);
            opacity: 0.5;
            mix-blend-mode: overlay;
            animation: glitch 2s infinite alternate-reverse;
            pointer-events: none;
            -webkit-text-fill-color: var(--primary);
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            text-align: right;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            text-shadow: var(--glow-text);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Control Panel */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            background: rgba(10, 15, 22, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            position: relative;
            animation: fadeInUp 0.6s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .control-panel::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cyber-input {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .cyber-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-dim);
        }

        .actions {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.8rem 2rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .cyber-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary);
            transition: transform 0.3s ease;
            z-index: -1;
        }

        .cyber-btn:hover {
            color: var(--bg-color);
            box-shadow: var(--glow);
        }

        .cyber-btn:hover::before {
            transform: translateX(100%);
        }

        .cyber-btn:disabled {
            border-color: var(--text-dim);
            color: var(--text-dim);
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .cyber-btn:disabled::before {
            display: none;
        }

        .cyber-btn.secondary {
            border-color: var(--text-dim);
            color: var(--text-dim);
        }

        .cyber-btn.secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            box-shadow: none;
        }
        
        .cyber-btn.secondary:hover::before {
            display: none;
        }

        /* Results Area */
        .results-area {
            animation: fadeInUp 0.6s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .results-title {
            font-size: 1.25rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .results-count {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--success);
            background: rgba(0, 255, 159, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 2px;
        }

        .table-container {
            overflow-x: auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* Corner accents */
        .table-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            border-bottom: 2px solid var(--primary);
            border-right: 2px solid var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: var(--surface-active);
            color: var(--primary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th.venue-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background: var(--surface-active);
            border-right: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-dim);
            transition: color 0.2s;
        }
        
        td.venue-name {
            font-weight: 600;
            color: var(--text-main);
            position: sticky;
            left: 0;
            background: var(--surface-color);
            border-right: 1px solid var(--border-color);
            z-index: 5;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }
        
        tr:hover td.venue-name {
            background: var(--surface-active);
        }

        /* Data Visualization Cells */
        .slot-cell {
            text-align: center;
            height: 40px;
            width: 40px;
            position: relative;
        }
        
        .slot-marker {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.8rem;
        }
        
        .available {
            background: rgba(0, 255, 159, 0.15);
            color: var(--success);
            box-shadow: inset 0 0 0 1px rgba(0, 255, 159, 0.3);
            cursor: pointer;
        }
        
        .available:hover {
            background: var(--success);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 159, 0.4);
        }
        
        .unavailable {
            color: rgba(255, 255, 255, 0.1);
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(255, 255, 255, 0.03) 5px,
                rgba(255, 255, 255, 0.03) 10px
            );
        }

        /* Football Specific */
        .football-slot {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            margin: 0.25rem;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .football-slot:hover {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: var(--glow);
        }
        
        .football-slot .count {
            background: rgba(0, 0, 0, 0.2);
            padding: 0 4px;
            border-radius: 2px;
            margin-left: 6px;
            font-size: 0.7rem;
        }

        /* District Group Header */
        .district-header {
            background: var(--surface-active);
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding-left: 1rem;
            border-left: 4px solid var(--secondary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface-active);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            color: var(--text-main);
            font-family: var(--font-mono);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .toast.error {
            border-left-color: var(--accent);
        }

        /* Loading Animation */
        .scanner {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2000;
            animation: scan 1.5s infinite linear;
            display: none;
        }

        .loading-state {
            padding: 4rem;
            text-align: center;
            color: var(--text-dim);
            font-family: var(--font-mono);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid var(--text-dim);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        /* Animations */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Media Queries */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .control-panel { grid-template-columns: 1fr; }
            .header-stats { display: none; }
            .actions { flex-wrap: wrap; }
            .cyber-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanner" id="loadingBar"></div>
    
    <div class="container">
        <header>
            <div class="brand">
                <h1>SmartPlay Monitor</h1>
                </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalVenues">--</div>
                    <div class="stat-label">场地</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activeRegions">4</div>
                    <div class="stat-label">区域</div>
                </div>
            </div>
        </header>

        <section class="control-panel">
            <div class="input-group">
                <label class="label">目标日期</label>
                <input type="date" class="cyber-input" id="playDate">
            </div>
            <div class="input-group">
                <label class="label">设施类型</label>
                <select class="cyber-input" id="faCode">
                        <option value="FOTP">足球</option>
                        <option value="BADC">羽毛球</option>
                    </select>
                </div>
            <div class="input-group">
                <label class="label">筛选</label>
                <input type="text" class="cyber-input" id="searchInput" placeholder="输入关键词搜索...">
            </div>
            <div class="actions">
                <button class="cyber-btn" id="fetchBtn">
                    <span>查询</span>
                </button>
                <button class="cyber-btn secondary" id="resetBtn">重置</button>
            </div>
        </section>

        <section class="results-area">
            <div class="results-header">
                <div class="results-title">
                    查询结果
                    <span class="results-count" id="resultCount">0</span>
                    </div>
                </div>
            
            <div class="table-container">
                <table id="dataTable">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="100%">
                                <div class="loading-state">
                                    <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">等待指令</div>
                                    <div>初始化查询以获取数据...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Import Logic -->
    <script src="process.js"></script>
    
    <script>
        // DOM Elements
        const playDateInput = document.getElementById('playDate');
        const faCodeSelect = document.getElementById('faCode');
        const searchInput = document.getElementById('searchInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tableBody = document.getElementById('tableBody');
        const tableHeader = document.getElementById('tableHeader');
        const dataTable = document.getElementById('dataTable');
        const resultCount = document.getElementById('resultCount');
        const totalVenuesDisplay = document.getElementById('totalVenues');
        const loadingBar = document.getElementById('loadingBar');

        // Initialize
        function init() {
            const today = new Date();
            const maxDate = new Date();
            maxDate.setDate(today.getDate() + 6);
            
            const tomorrow = new Date();
            tomorrow.setDate(today.getDate() + 1);
            
            playDateInput.value = tomorrow.toISOString().split('T')[0];
            playDateInput.min = today.toISOString().split('T')[0];
            playDateInput.max = maxDate.toISOString().split('T')[0];

            fetchBtn.addEventListener('click', fetchData);
            resetBtn.addEventListener('click', resetFilters);
            searchInput.addEventListener('input', debounce(() => {
                applyFilters(searchInput.value);
                renderTable();
            }, 300));

            // Initial auto-fetch
            fetchData();
        }

        async function fetchData() {
            const playDate = playDateInput.value;
            const faCode = faCodeSelect.value;

            if (!playDate) {
                showToast('需选择日期', 'error');
                return;
            }

            setLoading(true);

            // Clear table with loading state
            tableBody.innerHTML = `
                <tr>
                    <td colspan="100%">
                        <div class="loading-state">
                            <div class="loading-spinner"></div>
                            <div style="margin-top: 1rem">正在查询区域...</div>
                        </div>
                    </td>
                </tr>
            `;

            try {
                const result = await fetchVenueData(playDate, faCode);
                
                if (result.totalCount === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="100%">
                                <div class="loading-state">
                                    <div style="font-size: 2rem;">无数据</div>
                                    <div>当前参数未找到可用场次。</div>
                                </div>
                            </td>
                        </tr>
                    `;
                    resultCount.textContent = "0";
                    totalVenuesDisplay.textContent = "0";
                } else {
                    applyFilters(searchInput.value);
                    renderTable();
                    
                    const message = `查询完成`;
                    showToast(message, result.failCount > 0 ? 'error' : 'success');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="100%">
                            <div class="loading-state">
                                <div style="color: var(--accent)">系统错误</div>
                                <div>${error.message}</div>
                            </div>
                        </td>
                    </tr>
                `;
                showToast('数据获取失败', 'error');
            } finally {
                setLoading(false);
            }
        }

        function renderTable() {
            const timeSlots = getTimeSlots();
            const filteredData = getFilteredData();
            const isFootball = faCodeSelect.value === 'FOTP';
            
            // Update stats
            resultCount.textContent = `${filteredData.length}个场地查询完成`;
            totalVenuesDisplay.textContent = filteredData.length;

            const hasData = isFootball 
                ? filteredData.some(v => v.availableSlots && v.availableSlots.length > 0)
                : filteredData.length > 0 && timeSlots.length > 0;
            
            if (filteredData.length === 0 || !hasData) {
                tableHeader.innerHTML = '';
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="100%">
                            <div class="loading-state">
                                <div>无匹配记录</div>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            if (isFootball) {
                renderFootballTable(filteredData);
            } else {
                renderBadmintonTable(timeSlots, filteredData);
            }
        }

        function renderFootballTable(filteredData) {
            tableHeader.innerHTML = `
                <tr>
                    <th class="venue-col">位置</th>
                    <th>设施名称</th>
                    <th>可用时段</th>
                </tr>
            `;

            const venuesWithSlots = filteredData.filter(v => v.availableSlots && v.availableSlots.length > 0);
            const districtGroups = {};
            venuesWithSlots.forEach(venue => {
                if (!districtGroups[venue.district]) {
                    districtGroups[venue.district] = [];
                }
                districtGroups[venue.district].push(venue);
            });

            let bodyHtml = '';
            Object.entries(districtGroups).forEach(([district, venues]) => {
                bodyHtml += `<tr><td colspan="3" class="district-header">${escapeHtml(district)}</td></tr>`;
                
                venues.forEach(venue => {
                    bodyHtml += '<tr>';
                    bodyHtml += `<td class="venue-name" style="padding-left: 2rem;">${escapeHtml(venue.venueName)}</td>`;
                    bodyHtml += `<td style="font-family: var(--font-mono); font-size: 0.8rem; opacity: 0.7;">${escapeHtml(venue.facilityName)}</td>`;
                    
                    bodyHtml += '<td>';
                    venue.availableSlots.forEach(slot => {
                        const startTime = slot.start.replace(/:00$/, '');
                        const endTime = slot.end.replace(/:00$/, '');
                        const timeText = `${startTime}-${endTime}`;
                        const countBadge = slot.count > 1 ? `<span class="count">×${slot.count}</span>` : '';
                        
                        bodyHtml += `<span class="football-slot">${timeText}${countBadge}</span>`;
                    });
                    bodyHtml += '</td></tr>';
                });
            });

            tableBody.innerHTML = bodyHtml;
        }

        function renderBadmintonTable(timeSlots, filteredData) {
            let headerHtml = `<tr><th class="venue-col">场地</th>`;
            timeSlots.forEach(hour => {
                headerHtml += `<th>${hour}:00</th>`;
            });
            headerHtml += '</tr>';
            tableHeader.innerHTML = headerHtml;

            const districtGroups = {};
            filteredData.forEach(venue => {
                if (!districtGroups[venue.district]) {
                    districtGroups[venue.district] = [];
                }
                districtGroups[venue.district].push(venue);
            });

            let bodyHtml = '';
            Object.entries(districtGroups).forEach(([district, venues]) => {
                bodyHtml += `<tr><td colspan="${timeSlots.length + 1}" class="district-header">${escapeHtml(district)}</td></tr>`;
                
                venues.forEach(venue => {
                    bodyHtml += '<tr>';
                    bodyHtml += `<td class="venue-name" style="padding-left: 2rem;">
                        <div>${escapeHtml(venue.venueName)}</div>
                        <div style="font-size: 0.7rem; opacity: 0.5; font-family: var(--font-mono)">${escapeHtml(venue.facilityName)}</div>
                    </td>`;
                    
                    timeSlots.forEach(hour => {
                        const slot = venue.timeSlots.get(hour);
                        if (slot && slot.sessionCount > 0) {
                            bodyHtml += `<td><div class="slot-marker available" title="可用场次: ${slot.sessionCount}">${slot.sessionCount}</div></td>`;
                        } else if (slot) {
                            bodyHtml += `<td><div class="slot-marker unavailable">-</div></td>`;
                        } else {
                            bodyHtml += `<td><div class="slot-marker" style="opacity: 0.1">.</div></td>`;
                        }
                    });
                    bodyHtml += '</tr>';
                });
            });

            tableBody.innerHTML = bodyHtml;
        }

        function resetFilters() {
            searchInput.value = '';
            if (getAllData().length > 0) {
                applyFilters('');
                renderTable();
            }
        }

        function setLoading(isLoading) {
            fetchBtn.disabled = isLoading;
            fetchBtn.innerHTML = isLoading ? '<span>查询中...</span>' : '<span>查询</span>';
            loadingBar.style.display = isLoading ? 'block' : 'none';
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span style="font-size: 1.2rem">${type === 'success' ? '✔' : '⚠'}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
